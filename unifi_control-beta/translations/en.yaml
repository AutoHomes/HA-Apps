configuration:
  connection_mode:
    name: Connection
    description: "local = talk to your UniFi console on the LAN (fastest, recommended). cloud = go through Ubiquiti's Site Manager (api.ui.com)."
  local_host:
    name: Local - console address
    description: "IP or hostname of the device running UniFi Network (UCG, UDM, Cloud Key...), e.g. 192.168.1.1"
  local_port:
    name: Local - port
    description: "443 for UniFi OS consoles; usually 8443 for a self-hosted Network server."
  local_username:
    name: Local - username
    description: "A LOCAL UniFi admin account (UI.com accounts with MFA can't sign in from apps). Leave empty if you use an API key."
  local_password:
    name: Local - password
  local_api_key:
    name: Local - API key
    description: "Optional instead of username/password: UniFi Network → Settings → Control Plane → Integrations. UniFi OS consoles only."
  local_verify_ssl:
    name: Local - verify certificate
    description: "Leave off unless your console has a real (not self-signed) certificate."
  cloud_api_key:
    name: Cloud - Site Manager API key
    description: "Created at unifi.ui.com → API. Only used when Connection is cloud."
  cloud_console_id:
    name: Cloud - console ID
    description: "The long ID in the address bar when you open the console on unifi.ui.com."
  site:
    name: UniFi site
    description: "Short site name - 'default' unless you run several sites."
  force_provision:
    name: Force-provision gateway
    description: "Push each change to the gateway immediately instead of waiting for UniFi. Turn on if changes take a while to take effect (e.g. Cloud Key managing a separate gateway)."
  notify_services:
    name: Notify services (admin alerts)
    description: "Type each one and press Enter, e.g. mobile_app_my_phone. Every grant, expiry, open/close and WiFi change is sent here."
  grant_durations:
    name: Durations (hours)
    description: "Time choices offered for granting access and for opening a port to anyone. Whole hours from 1 to 720 - type each one and press Enter."
  public_ip_lookup:
    name: Detect "This device" IP
    description: "Lets the browser ask api.ipify.org for its public IP so it can be granted in one tap."
  wifi_password_length:
    name: Generated WiFi password length
  log_level:
    name: Log level
