name: "UniFi Control (beta)"
version: "1.0.1"
slug: "unifi_control-beta"
stage: experimental
description: "[Beta] Manage your UniFi network - with per-user permissions and admin phone alerts"
url: "https://github.com/AutoHomes/ha-apps/tree/main/unifi_control"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:router-network
panel_title: "UniFi"
# Non-admin users need the sidebar panel too; what they can do inside is
# decided per user by the app itself.
panel_admin: false
homeassistant_api: true
options:
  connection_mode: "local"
  local_host: ""
  local_port: 443
  local_username: ""
  local_password: ""
  local_api_key: ""
  local_verify_ssl: false
  cloud_api_key: ""
  cloud_console_id: ""
  site: "default"
  force_provision: false
  notify_services: []
  grant_durations:
    - "1"
    - "2"
    - "5"
  public_ip_lookup: true
  wifi_password_length: 16
  log_level: "info"
schema:
  connection_mode: "list(local|cloud)"
  local_host: "str?"
  local_port: "port"
  local_username: "str?"
  local_password: "password?"
  local_api_key: "password?"
  local_verify_ssl: "bool"
  cloud_api_key: "password?"
  cloud_console_id: "str?"
  site: "str"
  force_provision: "bool"
  notify_services:
    - "str"
  # Whole hours, 1-720. Text rather than int because the Configuration tab
  # can't edit a list of numbers (it shows one number box and saves a scalar).
  grant_durations:
    - "match(^([1-9][0-9]?|[1-6][0-9]{2}|7[01][0-9]|720)$)"
  public_ip_lookup: "bool"
  wifi_password_length: "int(8,63)"
  log_level: "list(debug|info|warning|error)"
