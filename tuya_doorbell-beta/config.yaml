name: "Tuya Lock Doorbell (beta)"
version: "1.0.1"
slug: "tuya_doorbell-beta"
stage: experimental
description: "[Beta] Run a Home Assistant script when someone presses the doorbell button on your Tuya / Smart Life smart lock"
url: "https://github.com/AutoHomes/ha-apps/tree/main/tuya_doorbell-beta"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:doorbell
panel_title: "Doorbell"
# Signing in to Smart Life and watching the lock's raw reports is admin work.
panel_admin: true
homeassistant_api: true
options:
  script: ""
  locks: []
  doorbell_codes:
    - "doorbell"
  cooldown_seconds: 10
  log_level: "info"
schema:
  script: "str?"
  locks:
    - "str"
  doorbell_codes:
    - "str"
  cooldown_seconds: "int(0,300)"
  log_level: "list(debug|info|warning|error)"
